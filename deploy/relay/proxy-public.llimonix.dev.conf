server {
    listen 80;
    listen [::]:80;
    server_name proxy-public.llimonix.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://proxy-public.llimonix.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proxy-public.llimonix.dev;

    ssl_certificate /etc/letsencrypt/live/proxy-public.llimonix.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy-public.llimonix.dev/privkey.pem;
    include /etc/nginx/snippets/ssl-common.conf;

    location = /health {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"status":"ok"}';
    }

    location = /v1/public-proxies {
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass https://raw.githubusercontent.com/nellimonix/mtproxy_list/refs/heads/main/mtproxy.json;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name raw.githubusercontent.com;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_set_header Connection "";

        proxy_cache public_proxy_cache;
        proxy_cache_key public-proxies;
        proxy_cache_valid 200 5m;
        proxy_cache_valid any 30s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
