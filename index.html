// ============ PROXIES ============
const PROXY_URL = 'https://raw.githubusercontent.com/llimonixbot/mtproxytg/refs/heads/files/proxies.json';

function loadProxies(){
  fetch(PROXY_URL)
    .then(r => r.json())
    .then(data => {
      proxies = shuffle(data.map(p => ({
        geo: p.geo || p.country || 'UN',
        name: p.name || p.country || p.host,
        server: p.server || p.host,
        port: p.port,
        secret: p.secret
      })));
      renderProxies();
    })
    .catch(err => {
      console.error('Ошибка загрузки прокси:', err);
    });
}

function togglePublicProxies(){
  const el=document.getElementById('pubSpoiler');
  el.classList.toggle('open');
  if(el.classList.contains('open')&&!pubLoaded&&!pubLoading)loadPublicProxies();
}

function loadPublicProxies(){
  const t=T[lang];
  const body=document.getElementById('pubBody');
  pubLoading=true;
  body.innerHTML='<div class="pub-spoiler-loader"><div class="pub-spinner"></div><span>'+esc(t.pub.loading)+'</span></div>';

  Promise.resolve(PUB_DATA)
    .then(_0x7b)
    .then(data=>{
      pubProxies=shuffle(data.map(p=>({geo:p.country,server:p.host,port:p.port,secret:p.secret})));
      pubLoaded=true;
      pubLoading=false;
      const cnt=document.getElementById('pubCount');
      cnt.textContent=pubProxies.length;
      cnt.style.display='';
      renderPublicGrid();
    })
    .catch(()=>{
      pubLoading=false;
      body.innerHTML='<div style="text-align:center;padding:24px 0;color:#5b6b7b;font-size:14px">'+esc(t.pub.error)+'</div>';
    });
}

function renderPublicGrid(){
  const t=T[lang];
  const body=document.getElementById('pubBody');
  body.innerHTML='<div class="proxy-grid">'+pubProxies.map(p=>
    '<div class="proxy-card"><div class="proxy-info"><div class="proxy-flag">'+flagImg(p.geo)+'</div><div class="proxy-meta"><div class="proxy-name" title="'+esc(p.server)+'">'+esc(p.server)+'</div><div class="proxy-details"><span class="proxy-tag">'+esc(p.geo)+'</span><span class="proxy-tag">:'+p.port+'</span></div></div></div><a href="tg://proxy?server='+esc(p.server)+'&port='+p.port+'&secret='+esc(p.secret)+'" class="btn-connect">'+esc(t.proxies.connect)+'</a></div>'
  ).join('')+'</div>';
}

// ============ RENDER ============
function render(){
  const t=T[lang];
  const isRTL=lang==='ir';
  document.documentElement.lang=isRTL?'fa':lang;
  document.documentElement.dir=isRTL?'rtl':'ltr';

  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=document.getElementById('view-'+currentView);
  if(el)el.classList.add('active');

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const val=key.split('.').reduce((o,k)=>o&&o[k],t);
    if(val)el.textContent=val;
  });

  const navKeys=['home','howto','about','pwa','contacts'];
  const langBtns='<div class="lang-switch">'+['ru','en','ir'].map(l=>'<button class="lang-btn'+(lang===l?' active':'')+'" onclick="setLang(\''+l+'\')">'+l.toUpperCase()+'</button>').join('')+'</div>';

  document.getElementById('desktopNav').innerHTML=navKeys.map(k=>'<a href="#'+(k==='home'?'':k)+'" class="nav-link'+(currentView===k?' active':'')+'" onclick="navigate(\''+k+'\');return false">'+t.nav[k]+'</a>').join('')+langBtns;

  const mobile=document.getElementById('mobileMenu');
  mobile.innerHTML=navKeys.map(k=>'<a href="#'+(k==='home'?'':k)+'" class="nav-link'+(currentView===k?' active':'')+'" onclick="navigate(\''+k+'\');return false">'+t.nav[k]+'</a>').join('')+'<div class="lang-switch" style="margin:16px 0 0;justify-content:center">'+['ru','en','ir'].map(l=>'<button class="lang-btn'+(lang===l?' active':'')+'" onclick="setLang(\''+l+'\')">'+l.toUpperCase()+'</button>').join('')+'</div>';

  document.getElementById('footerLinks').innerHTML=navKeys.map(k=>'<a href="#'+(k==='home'?'':k)+'" onclick="navigate(\''+k+'\');return false">'+t.nav[k]+'</a>').join('');

  renderProxies();
  if(pubLoaded)renderPublicGrid();
  renderFAQ();renderHowto();renderAbout();renderPWA();renderSEO();
}

function renderProxies(){
  const t=T[lang];
  document.getElementById('proxyGrid').innerHTML=proxies.map(p=>
    '<div class="proxy-card"><div class="proxy-info"><div class="proxy-flag">'+flagImg(p.geo)+'</div><div class="proxy-meta"><div class="proxy-name">'+esc(p.name)+'</div><div class="proxy-details"><span class="proxy-tag">'+esc(p.geo)+'</span><span class="proxy-tag online"><span class="proxy-status"></span>'+t.proxies.online+'</span></div></div></div><a href="tg://proxy?server='+esc(p.server)+'&port='+p.port+'&secret='+esc(p.secret)+'" class="btn-connect">'+t.proxies.connect+'</a></div>'
  ).join('');
}

function renderFAQ(){
  const items=T[lang].faq.items;
  document.getElementById('faqList').innerHTML=items.map(i=>'<div class="faq-item" onclick="toggleFAQ(this)"><div class="faq-q"><span>'+esc(i.q)+'</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div><div class="faq-a">'+esc(i.a)+'</div></div>').join('');
  let s=document.getElementById('faqSchema');
  if(!s){s=document.createElement('script');s.type='application/ld+json';s.id='faqSchema';document.head.appendChild(s);}
  s.textContent=JSON.stringify({'@context':'https://schema.org','@type':'FAQPage',mainEntity:items.map(i=>({'@type':'Question',name:i.q,acceptedAnswer:{'@type':'Answer',text:i.a}}))});
}
function toggleFAQ(el){el.classList.toggle('open');}

function renderHowto(){
  const h=T[lang].howto;
  document.getElementById('howtoSteps').innerHTML=h.steps.map((s,i)=>'<div class="content-block"><h3><span class="step-num">'+(i+1)+'</span>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p></div>').join('');
}
function renderAbout(){
  const a=T[lang].about;
  document.getElementById('aboutBlocks').innerHTML=a.blocks.map(b=>'<div class="content-block"><h3><span class="icon-inline">'+getIcon(b.icon)+'</span>'+esc(b.t)+'</h3><p>'+esc(b.p)+'</p></div>').join('');
}
function renderPWA(){
  const p=T[lang].pwa;
  document.getElementById('pwaSections').innerHTML=p.sections.map(sec=>'<div class="content-block"><h3>'+esc(sec.title)+'</h3><div class="pwa-steps">'+sec.steps.map((s,i)=>'<div class="pwa-step"><div class="pwa-step-num">'+(i+1)+'</div><div><h4>'+esc(s.title)+'</h4><p>'+esc(s.desc)+'</p></div></div>').join('')+'</div></div>').join('');
}
function renderSEO(){
  const s=T[lang].seo;
  document.getElementById('seoBlock').innerHTML='<h2>'+esc(s.title)+'</h2>'+s.paragraphs.map(p=>'<p>'+esc(p)+'</p>').join('');
}

function getIcon(n){
  const i={shield:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',info:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',refresh:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>',server:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>'};
  return i[n]||'';
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function setLang(l){lang=l;try{localStorage.setItem('mtproxy_lang',l);}catch(e){}render();}

window.addEventListener('hashchange',()=>{
  const h=location.hash.replace('#','')||'home';
  if(['home','howto','about','pwa','contacts'].includes(h)){currentView=h;render();window.scrollTo(0,0);}
});
